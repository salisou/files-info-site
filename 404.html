<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pagina non trovata | Moussa Salisou</title>
  <link rel="stylesheet" href="/assets/css/modern.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;margin:0;background:#f7f9fc;color:#172033;font-family:Arial,sans-serif}
    .error-card{max-width:680px;margin:24px;padding:48px 32px;text-align:center;background:#fff;border:1px solid #e5eaf2;border-radius:28px;box-shadow:0 20px 60px rgba(23,32,51,.08)}
    .error-code{font-size:88px;line-height:1;font-weight:800;letter-spacing:-.06em;color:#173b63;margin:0 0 12px}
    .error-card h1{margin:0 0 12px;font-size:30px}.error-card p{color:#667085;line-height:1.7;margin:0 auto 28px;max-width:540px}
    .error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.error-actions a{display:inline-flex;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:700}.primary{background:#173b63;color:#fff}.secondary{border:1px solid #d8dee8;color:#173b63}
  </style>
</head>
<body>
  <main class="error-card">
    <div class="error-code">404</div>
    <h1>Pagina non trovata</h1>
    <p>Il collegamento che hai seguito non è disponibile oppure l'indirizzo è stato modificato. Puoi tornare alla home o consultare tutti i corsi.</p>
    <div class="error-actions">
      <a class="primary" href="/">Torna alla home</a>
      <a class="secondary" href="/courses/">Vedi i corsi</a>
    </div>
  </main>
</body>
</html>
