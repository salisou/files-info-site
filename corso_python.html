<script>
const P=(s)=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const kw=/\b(def|return|if|elif|else|for|while|in|import|from|class|try|except|finally|with|as|and|or|not|True|False|None|break|continue|raise|pass|lambda|print|input|range|len)\b/g;
function hl(code){return P(code).split("\n").map(l=>{const i=l.indexOf("#");let a=i<0?l:l.slice(0,i),c=i<0?"":'<span class="c">'+l.slice(i)+'</span>';a=a.replace(/(&quot;.*?&quot;|".*?"|'.*?')/g,'<span class="s">$1</span>').replace(kw,m=>'<span class="k">'+m+'</span>');return a+c}).join("\n")}
const code=(c,o)=>`<pre><button class="cp">Copia</button><code>${hl(c)}</code></pre>${o?`<div class="out">${P(o)}</div>`:""}`;
const prof=t=>`<div class="prof"><b>Parola del prof.</b> ${t}</div>`;
const L=[
{t:"Benvenuto e primo programma",b:`<p>Python è nato per essere letto da umani. Per questo è il linguaggio ideale per cominciare, e lo usano anche Google, la NASA e chi fa intelligenza artificiale. In trent'anni ho visto nascere e morire decine di linguaggi: Python resta.</p>
<h2>Installare Python</h2><p>Scarica l'ultima versione da <code>python.org</code> e, su Windows, spunta <em>Add Python to PATH</em>. Come editor consiglio VS Code, oppure l'IDLE incluso. Per provare subito senza installare nulla, cerca "Python online" nel browser.</p>
<h2>Il tuo primo programma</h2>${code(`print("Ciao, mondo!")`,"Ciao, mondo!")}
<p><code>print()</code> mostra un testo a schermo. Il testo va tra virgolette. Tutto qui: sei già programmatore.</p>
${prof("Non copiare e incollare: digita ogni esempio a mano. Gli errori di battitura sono la miglior palestra. Un errore non è un fallimento, è un messaggio che ti dice dove guardare.")}
<h2>I commenti</h2>${code(`# Questo è un commento: Python lo ignora
print("Si legge meglio così")  # anche a fine riga`)}`,
q:["Quale istruzione mostra un testo a schermo?",["print()","show()","echo()"],0]},
{t:"Variabili e tipi di dati",b:`<p>Una variabile è un'etichetta attaccata a un valore. Il segno <code>=</code> non significa "uguale" ma "assegna".</p>
${code(`nome = "Giulia"
eta = 29
altezza = 1.68
iscritta = True

print(nome, eta)
print(type(altezza))`,"Giulia 29\n<class 'float'>")}
<h2>I quattro tipi base</h2><ul><li><code>str</code>: testo, "ciao"</li><li><code>int</code>: numeri interi, 42</li><li><code>float</code>: decimali, 3.14 (col punto, non la virgola)</li><li><code>bool</code>: <code>True</code> o <code>False</code></li></ul>
<h2>Convertire</h2>${code(`n = int("15")      # da testo a intero
s = str(15)        # da intero a testo
f = float("2.5")`)}
${prof("Dai nomi che raccontano: <code>prezzo_totale</code> vale più di <code>x</code>. Tra sei mesi il lettore sarai tu, e non ricorderai nulla. Per convenzione si usa minuscolo_con_trattino_basso.")}`,
q:["Come si scrive correttamente un decimale in Python?",["3,14","3.14","\"3.14\" senza conversione"],1]},
{t:"Operatori e input dell'utente",b:`<h2>Matematica</h2>${code(`print(7 + 2)    # 9
print(7 / 2)    # 3.5  divisione normale
print(7 // 2)   # 3    divisione intera
print(7 % 2)    # 1    resto
print(2 ** 10)  # 1024 potenza`)}
<h2>Chiedere dati</h2>${code(`nome = input("Come ti chiami? ")
anni = int(input("Quanti anni hai? "))
print("Ciao", nome, "tra 10 anni ne avrai", anni + 10)`,"Come ti chiami? Marco\nQuanti anni hai? 30\nCiao Marco tra 10 anni ne avrai 40")}
<p><code>input()</code> restituisce sempre testo. Se ti serve un numero, convertilo con <code>int()</code> o <code>float()</code>.</p>
${prof("L'errore numero uno dei principianti: sommare \"5\" + \"5\" e ottenere \"55\". Se vedi numeri che si incollano, controlla di aver convertito.")}`,
q:["Che tipo restituisce sempre input()?",["int","str","dipende da cosa scrivi"],1]},
{t:"Le stringhe",b:`${code(`s = "Python è fantastico"
print(len(s))          # lunghezza
print(s.upper())       # MAIUSCOLO
print(s[0])            # primo carattere: P
print(s[-1])           # ultimo carattere
print(s[0:6])          # fetta: Python
print(s.replace("fantastico", "divertente"))`)}
<h2>f-string: il modo moderno</h2>${code(`nome = "Luca"
voto = 8.5
print(f"{nome} ha preso {voto}")
print(f"Doppio: {voto * 2:.1f}")`,"Luca ha preso 8.5\nDoppio: 17.0")}
<p>Metti una <code>f</code> prima delle virgolette e scrivi le variabili tra graffe. Niente più concatenazioni infinite.</p>
${prof("Si conta da zero. Il primo carattere è il numero 0. Ti confonderà per una settimana, poi diventerà naturale. Anche i professionisti ci inciampano ogni tanto.")}`,
q:["Cosa stampa \"Ciao\"[1]?",["C","i","a"],2]},
{t:"Decisioni con if",b:`${code(`eta = int(input("Età: "))

if eta >= 18:
    print("Maggiorenne")
elif eta >= 14:
    print("Adolescente")
else:
    print("Bambino")`)}
<p>I due punti e il <strong>rientro</strong> (4 spazi) sono la sintassi di Python: ciò che è rientrato appartiene al blocco.</p>
<h2>Confronti e logica</h2>${code(`# ==  !=  <  >  <=  >=
if eta >= 18 and eta < 65:
    print("In età lavorativa")
if not eta < 0:
    print("Valore valido")`)}
${prof("<code>=</code> assegna, <code>==</code> confronta. Confonderli è il classico errore da primo mese. L'indentazione sbagliata è il secondo: tieni sempre lo stesso numero di spazi.")}`,
q:["Quale operatore confronta due valori?",["=","==","=>"],1]},
{t:"I cicli: for e while",b:`${code(`for i in range(5):
    print("Giro", i)      # 0,1,2,3,4

frutti = ["mela", "pera", "kiwi"]
for f in frutti:
    print(f)`)}
<h2>while: finché la condizione è vera</h2>${code(`tentativi = 0
while tentativi < 3:
    print("Tentativo", tentativi + 1)
    tentativi += 1`,"Tentativo 1\nTentativo 2\nTentativo 3")}
<p><code>break</code> esce dal ciclo, <code>continue</code> salta al giro successivo.</p>
${prof("Prima di scrivere un <code>while</code> chiediti: cosa lo fa fermare? Se la risposta è \"niente\", hai appena scritto un ciclo infinito. Si ferma con Ctrl+C.")}`,
q:["Quanti giri fa range(5)?",["4","5","6"],1]},
{t:"Liste e tuple",b:`${code(`voti = [7, 9, 6]
voti.append(8)         # aggiunge
voti.remove(6)         # toglie il valore 6
voti[0] = 10           # modifica
print(sorted(voti))    # ordinata
print(sum(voti) / len(voti))   # media
quadrati = [n * n for n in range(1, 6)]
print(quadrati)`,"[7, 8, 9, 10]\n8.75\n[1, 4, 9, 16, 25]")}
<p>L'ultima riga è una <em>list comprehension</em>: una lista costruita in una riga. Una tupla è come una lista che non si può modificare:</p>
${code(`coordinate = (45.4, 9.2)`)}
${prof("Lista per dati che cambiano, tupla per dati fissi come coordinate o date. Scegliere bene lo strumento è metà della programmazione.")}`,
q:["Quale metodo aggiunge un elemento in fondo a una lista?",["add()","append()","push()"],1]},
{t:"Dizionari e insiemi",b:`<p>Un dizionario associa una <strong>chiave</strong> a un <strong>valore</strong>, come una rubrica.</p>
${code(`persona = {"nome": "Anna", "eta": 31}
persona["citta"] = "Parma"
print(persona["nome"])
print(persona.get("lavoro", "non indicato"))
for chiave, valore in persona.items():
    print(chiave, "→", valore)`)}
<h2>Gli insiemi (set)</h2>${code(`a = {1, 2, 3, 3, 3}
print(a)          # {1, 2, 3}  niente duplicati
print(a & {2, 3, 9})   # intersezione: {2, 3}`)}
${prof("Con <code>.get()</code> eviti l'errore se la chiave non esiste. Usa i set per eliminare doppioni: <code>list(set(lista))</code>.")}`,
q:["Come si legge il valore associato alla chiave \"nome\"?",["persona[\"nome\"]","persona.nome()","persona(\"nome\")"],0]},
{t:"Funzioni",b:`<p>Una funzione è un pezzo di codice con un nome, scritto una volta e usato quante volte vuoi. Regola dei vecchi artigiani: ogni funzione fa <em>una</em> cosa.</p>
${code(`def saluta(nome, saluto="Ciao"):
    return f"{saluto}, {nome}!"

print(saluta("Sara"))
print(saluta("Paolo", saluto="Buongiorno"))

def area_rettangolo(base, altezza):
    """Calcola l'area di un rettangolo."""
    return base * altezza`,"Ciao, Sara!\nBuongiorno, Paolo!")}
<p><code>return</code> restituisce un risultato. Senza <code>return</code> la funzione restituisce <code>None</code>. Il testo tra tre virgolette è la documentazione.</p>
${prof("Se copi lo stesso codice due volte, hai trovato una funzione che aspetta di nascere. È il principio DRY: Don't Repeat Yourself.")}`,
q:["Quale parola chiave definisce una funzione?",["function","def","func"],1]},
{t:"File ed errori",b:`${code(`with open("note.txt", "w", encoding="utf-8") as f:
    f.write("Prima riga\\n")

with open("note.txt", encoding="utf-8") as f:
    for riga in f:
        print(riga.strip())`)}
<p><code>with</code> chiude il file da solo, anche se qualcosa va storto.</p>
<h2>Gestire gli errori</h2>${code(`try:
    n = int(input("Numero: "))
    print(10 / n)
except ValueError:
    print("Non hai scritto un numero")
except ZeroDivisionError:
    print("Non si divide per zero")`)}
${prof("Gli utenti sbagliano sempre, e hanno ragione loro. Un buon programma prevede l'errore e spiega cosa fare, senza mostrare messaggi criptici.")}`,
q:["Quale blocco intercetta un errore?",["try / except","if / else","catch / throw"],0]},
{t:"Classi e oggetti (OOP)",b:`<p>Una classe è lo stampo, un oggetto è il biscotto. Raggruppa dati e comportamenti.</p>
${code(`class Conto:
    def __init__(self, titolare, saldo=0):
        self.titolare = titolare
        self.saldo = saldo

    def versa(self, importo):
        self.saldo += importo

    def __str__(self):
        return f"{self.titolare}: {self.saldo} €"

c = Conto("Elena", 100)
c.versa(50)
print(c)`,"Elena: 150 €")}
<p><code>__init__</code> è il costruttore, <code>self</code> è l'oggetto stesso.</p>
${prof("Non partire dalle classi: partono bene solo dopo che hai scritto molte funzioni. Usale quando hai dati e azioni che vivono insieme, come un conto e i suoi versamenti.")}`,
q:["Come si chiama il metodo che inizializza un oggetto?",["__init__","__new__ obbligatorio","start()"],0]},
{t:"Moduli e librerie",b:`${code(`import random, math, datetime

print(random.randint(1, 6))
print(math.sqrt(144))
print(datetime.date.today())`)}
<p>La libreria standard ha di tutto. Per quelle esterne si usa <code>pip</code>:</p>
${code(`pip install requests`)}
<p>Per iniziare: <code>requests</code> (web), <code>pandas</code> (dati), <code>matplotlib</code> (grafici), <code>flask</code> (siti web), <code>pygame</code> (giochi). Crea sempre un ambiente virtuale per progetto:</p>
${code(`python -m venv .venv`)}
${prof("Prima di scrivere una funzione complicata, cerca se esiste già. Il bravo programmatore è anche quello che sa cosa non deve scrivere.")}`,
q:["Con quale comando si installa una libreria esterna?",["pip install nome","python get nome","import nome"],0]},
{t:"Progetto finale: indovina il numero",b:`<p>Mettiamo insieme tutto: variabili, input, cicli, if, funzioni, moduli.</p>
${code(`import random

def gioca(massimo=100):
    segreto = random.randint(1, massimo)
    tentativi = 0
    while True:
        try:
            n = int(input(f"Numero (1-{massimo}): "))
        except ValueError:
            print("Scrivi un numero intero.")
            continue
        tentativi += 1
        if n < segreto:
            print("Troppo basso")
        elif n > segreto:
            print("Troppo alto")
        else:
            print(f"Esatto in {tentativi} tentativi!")
            break

gioca()`)}
<h2>Sfide per crescere</h2><ul><li>Limita i tentativi a 7</li><li>Salva il miglior punteggio su file</li><li>Aggiungi i livelli di difficoltà</li><li>Poi: una rubrica, una to-do list, un convertitore di valute</li></ul>
${prof("Complimenti: sai le basi. Ora il segreto è uno solo: costruisci cose che ti interessano, ogni giorno, anche per venti minuti. Si impara programmando, non leggendo.")}`,
q:["Quale istruzione esce da un ciclo while True?",["stop","break","exit_loop"],1]}
];
const DATA_ANALYSIS_TOPICS=[["Introduzione alla Data Analysis","Capire il ruolo della Data Analysis e trasformare una domanda di business in un'analisi misurabile."],["Ruolo del Data Analyst e workflow","Conoscere il workflow professionale: domanda, acquisizione, qualità, pulizia, analisi, visualizzazione e comunicazione."],["Ambiente Python per Data Analysis","Configurare Python, venv, pip e le librerie principali per lavorare sui dati."],["VS Code e Jupyter Notebook","Scegliere tra script Python e notebook e organizzare un ambiente di lavoro riproducibile."],["Python fondamentale per i dati","Usare variabili, funzioni, comprehension e strutture dati in problemi orientati ai dati."],["NumPy arrays","Lavorare con array numerici efficienti e operazioni vettoriali."],["Indexing e slicing NumPy","Selezionare elementi, righe, colonne e intervalli di un array."],["Operazioni vettoriali NumPy","Eseguire calcoli su interi array senza cicli manuali."],["Statistica con NumPy","Calcolare media, mediana, deviazione standard, minimo, massimo e percentili."],["Pandas Series","Rappresentare e analizzare una singola variabile con una Series."],["Pandas DataFrame","Gestire tabelle con righe, colonne, indici e tipi di dato."],["Importazione dati CSV","Caricare dataset CSV e controllarne rapidamente struttura e contenuto."],["Importazione dati Excel","Leggere fogli Excel e importarli in DataFrame."],["Importazione dati JSON","Importare dati JSON, tipici delle API e dei sistemi web."],["Esplorazione e ispezione dei dati","Usare shape, columns, dtypes, info, head e describe prima di trasformare i dati."],["Missing values","Individuare valori mancanti e scegliere strategie corrette di gestione."],["Pulizia e standardizzazione dei dati","Uniformare testi, numeri, categorie e formati per ottenere dati coerenti."],["Duplicati e tipi di dati","Individuare duplicati e convertire le colonne nei tipi appropriati."],["String operations con Pandas","Pulire e trasformare colonne testuali con l'accessor str."],["Filtering e condizioni","Selezionare righe tramite maschere booleane e condizioni multiple."],["Sorting e ranking","Ordinare record e costruire classifiche."],["GroupBy e aggregazioni","Raggruppare dati e calcolare somme, medie, conteggi e KPI."],["Merge, join e concat","Unire dataset tramite chiavi o concatenazione."],["Pivot e reshape","Cambiare la forma dei dati con pivot_table e melt."],["Date, time series e periodi","Convertire date ed estrarre anno, mese e altri periodi per analisi temporali."],["Exploratory Data Analysis (EDA)","Esplorare distribuzioni, relazioni e anomalie prima delle conclusioni."],["Statistiche descrittive","Interpretare media, mediana, quartili, deviazione standard, minimo e massimo."],["Distribuzioni e percentili","Leggere la distribuzione dei dati attraverso quantili e visualizzazioni."],["Correlazione e covarianza","Misurare associazioni tra variabili distinguendole dalla causalità."],["Outlier e anomalie","Individuare valori insoliti con IQR e controlli di contesto."],["Matplotlib: grafici fondamentali","Creare grafici a barre, linee, scatter e istogrammi."],["Matplotlib: grafici professionali","Migliorare titoli, etichette, legenda, dimensioni e salvataggio dei grafici."],["Seaborn e visualizzazione statistica","Creare boxplot, heatmap e grafici statistici più espressivi."],["Storytelling e reportistica","Trasformare risultati numerici in una storia chiara e verificabile."],["Export in CSV ed Excel","Esportare dataset puliti e report in formati condivisibili."],["SQL per Data Analyst con Python","Usare SQL insieme a Pandas per interrogare dati relazionali."],["Dashboard e KPI","Costruire indicatori utili per monitorare prestazioni e risultati."],["Tkinter per piccoli strumenti Data Analyst","Creare piccoli strumenti desktop per avviare analisi e mostrare risultati."],["AI per Data Analysis","Usare l'AI come assistente per codice, ipotesi, documentazione e controllo degli errori."],["Progetto finale: analisi completa di un dataset","Integrare Python, Pandas, NumPy, pulizia, EDA, grafici, SQL, KPI, export e report in un progetto completo."]];
const dataLesson=(title,desc,index)=>{let code='';if(/NumPy|array|Statistiche|percentili|Correlazione|Outlier/.test(title))code='import numpy as np\n\nx = np.array([10, 20, 30, 40, 50])\nprint(x.mean())\nprint(x.std())';else if(/Pandas|CSV|Excel|JSON|Missing|Pulizia|Duplicati|String|Filtering|Sorting|GroupBy|Merge|Pivot|Date|EDA|Export/.test(title))code='import pandas as pd\n\ndf = pd.DataFrame({"categoria":["A","A","B"],"totale":[100,150,80]})\nprint(df.head())\nprint(df.describe())';else if(/Matplotlib|Seaborn|Storytelling|Dashboard/.test(title))code='import matplotlib.pyplot as plt\n\nplt.bar(["A","B","C"], [120, 180, 150])\nplt.title("KPI")\nplt.show()';else if(/SQL/.test(title))code='import sqlite3\n\ncon = sqlite3.connect("dati.db")\n# SELECT ... FROM ... WHERE ...\nprint("Query eseguita")';else if(/Tkinter/.test(title))code='import tkinter as tk\n\nroot = tk.Tk()\nroot.title("Data Analyst Tool")\ntk.Label(root, text="Analisi dati").pack(padx=20, pady=20)\nroot.mainloop()';else if(/AI/.test(title))code='prompt = "Spiega questo dataset, trova anomalie e proponi 5 domande EDA."\nprint(prompt)';else code='dati = [120, 135, 128, 150]\nmedia = sum(dati) / len(dati)\nprint("Media:", media)';return {t:title,b:`<p><strong>Cos'è?</strong> ${desc}</p><h2>A cosa serve?</h2><p>Serve a trasformare dati grezzi in informazioni utili e verificabili. Nel lavoro reale il concetto va applicato a un dataset concreto, controllando sempre qualità e significato dei risultati.</p><h2>Esempio pratico</h2>${codeBlock(code)}${prof("Non limitarti a eseguire l'esempio: modifica i dati, prova un caso diverso e spiega a parole il risultato.")}`,q:["Qual è il comportamento corretto in questo modulo?",["Comprendere, provare e verificare il risultato","Copiare senza controllare","Ignorare la qualità dei dati"],0]}};
const codeBlock=(c,o)=>`<pre><button class="cp">Copia</button><code>${hl(c)}</code></pre>${o?`<div class="out">${P(o)}</div>`:""}`;
L.push(...DATA_ANALYSIS_TOPICS.map((x,i)=>dataLesson(x[0],x[1],i)));
const $=s=>document.querySelector(s);
let cur=0,done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("py-completo-done")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("py-completo-done",JSON.stringify([...done]))}catch(e){}}
function drawNav(){
$("#list").innerHTML=L.map((l,i)=>`<button class="l ${done.has(i)?"done":""}" data-i="${i}" ${i===cur?'aria-current="true"':""}><span class="tick">${done.has(i)?"✓":""}</span><span>${l.t}</span></button>`).join("");
const p=Math.round(done.size/L.length*100);$("#fill").style.width=p+"%";$("#pct").textContent=`${done.size} di ${L.length} moduli completati (${p}%)`}
function show(i){
cur=i;const l=L[i];const [q,o,a]=l.q;
$("#main").innerHTML=`<p class="kick">Modulo ${i+1} di ${L.length}</p><h1>${l.t}</h1>${l.b}
<section class="quiz"><h2>Mettiti alla prova</h2><p>${q}</p>${o.map((t,k)=>`<button class="opt" data-k="${k}">${P(t)}</button>`).join("")}<p class="fb" role="status" aria-live="polite"></p></section>
<div class="nav2"><button class="btn g" id="prev" ${i?"":"disabled"}>Indietro</button><button class="btn" id="next">${i<L.length-1?"Modulo successivo":"Ricomincia"}</button></div>`;
$("#main").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
const ok=+b.dataset.k===a;const fb=$(".fb");
if(ok){b.classList.add("ok");fb.textContent="Esatto. Lezione completata!";done.add(i);save();drawNav();$("#main").querySelectorAll(".opt").forEach(x=>x.disabled=true)}
else{b.classList.add("bad");fb.textContent="Non proprio. Rileggi l'esempio e riprova."}});
$("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i<L.length-1?i+1:0);
$("#main").querySelectorAll(".cp").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.nextElementSibling.textContent).then(()=>{b.textContent="Copiato";setTimeout(()=>b.textContent="Copia",1200)}).catch(()=>{})});
drawNav();$("#nav").classList.remove("open")}
function go(i){location.hash="l"+(i+1);show(i);window.scrollTo(0,0)}
$("#list").onclick=e=>{const b=e.target.closest(".l");if(b)go(+b.dataset.i)};
$("#menu").onclick=()=>$("#nav").classList.toggle("open");
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#10172a";r.dataset.theme=d?"light":"dark"};
$("#reset").onclick=()=>{if(confirm("Vuoi azzerare i progressi del corso Python?")){done=new Set();save();drawNav();show(cur)}};
const m=/^#l(\d+)$/.exec(location.hash);show(m&&L[m[1]-1]?m[1]-1:0);
</script>
