<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SQL Server — Corso completo con editor</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/ms-icon.svg">
    <link rel="apple-touch-icon" href="/assets/images/ms-icon.svg">
    <link rel="stylesheet" href="/assets/css/modern.css">
    <link rel="stylesheet" href="/assets/css/site-navbar.css">
    <link rel="stylesheet" href="/courses/sql-server/css/styles.css">
    <script src="/assets/js/site-navbar.js"></script>
    <script src="/assets/js/i18n.js"></script>
</head>

<body>
    <div class="wrap">
        <button id="lesson-menu-toggle" type="button" aria-controls="nav" aria-expanded="false">☰ Indice lezioni</button>
        <nav id="nav"><input id="q" placeholder="Cerca un argomento…"><small id="pt"></small>
            <div class="pg"><i id="pb"></i></div>
            <div id="ls"></div>
        </nav>
        <main id="main"></main>
    </div>
    <div id="dock" class="cl">
        <div class="bar"><b>⌨️ Editor SQL <span class="nr" id="tm"></span></b><button class="pr" id="run">▶ Esegui
                (Ctrl+Invio)</button><button id="chk" hidden>✔ Verifica esercizio</button><button id="rst">↺ Reset
                DB</button><button id="th" aria-label="Cambia tema">🌓</button><button id="tg">▲ Apri</button></div>
        <div class="db">
            <div class="ed">
                <pre id="hl"></pre><textarea id="ta" spellcheck="false"></textarea>
            </div>
            <div id="rs">
                <div id="msg" class="nr">Scrivi una query ed eseguila. Il database contiene 6 tabelle collegate.</div>
                <div id="out"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/alasql@4.5.2/dist/alasql.min.js"></script>
    <script src="/courses/sql-server/data/database.js"></script>
    <script src="/courses/sql-server/js/app.js"></script>
    <script src="/courses/sql-server/js/course.js"></script>
</body>

</html>
